name: Build and Push to ECR

on:
  push:
    branches: 
      - main
      - test/websocket
    paths:
      - '**'
      - '.github/workflows/deployment.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sf-backend-websocket:latest
            ${{ steps.login-ecr.outputs.registry }}/sf-backend-websocket:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/sf-backend-websocket:latest
          cache-to: type=inline

      - name: Image digest
        run: |
          echo "Image pushed to ECR:"
          echo "${{ steps.login-ecr.outputs.registry }}/sf-backend-websocket:latest"
          echo "${{ steps.login-ecr.outputs.registry }}/sf-backend-websocket:${{ github.sha }}"

      - name: Update Helm Chart Image Tag
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/lgcns5team/factory-tycoon-k8s.git
          cd factory-tycoon-k8s/helm/factory-tycoon-websocket
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|g" values-prod.yaml
          cd ../..
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add .
          git commit -m "Update websocket image tag to ${{ github.sha }}"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/lgcns5team/factory-tycoon-k8s.git